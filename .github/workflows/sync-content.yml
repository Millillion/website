# Pins the README and Learn-content commits the site renders (scripts/sync-content.mjs).
name: sync-content
on:
  # Hourly, except on Sunday in US Eastern time (Jordan, 2026-11-07): Sunday
  # 00:00-03:59 UTC is still Saturday in New York, and Monday 00:00-04:59 UTC
  # is still Sunday there, under both EST and EDT.
  schedule:
    - cron: "17 * * * 2-6"
    - cron: "17 0-3 * * 0"
    - cron: "17 5-23 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: sync-content, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Pin each project's latest content commit
        env: { GH_TOKEN: "${{ github.token }}" }
        run: node scripts/sync-content.mjs
      - name: Commit if anything changed
        run: |
          git diff --quiet && { echo "content unchanged"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Sync READMEs and project content"
          git push
