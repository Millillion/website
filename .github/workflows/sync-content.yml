# Pins the README and Learn-content commits the site renders (scripts/sync-content.mjs).
name: sync-content
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: sync-content, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Pin each project's latest content commit
        env: { GH_TOKEN: "${{ github.token }}" }
        run: node scripts/sync-content.mjs
      - name: Commit if anything changed
        run: |
          git diff --quiet && { echo "content unchanged"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Sync READMEs and project content"
          git push
